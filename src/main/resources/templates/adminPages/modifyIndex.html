<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>modifier accueil</title>
</head>

<body class="index-content-modify-body">
    <h1>Modifier Accueil</h1>

    <form th:action="@{/indexContent/updateindex}" th:object="${indexcontent1}" method="post"
        enctype="multipart/form-data">

        <table class="table table-bordered">
            <tr>
                <td>
                    <input type="number" name="id" id="id" th:field="*{id}" class="id-input" readonly />
                </td>
            </tr>
            <tr>
                <td>
                    <input type="text" name="h1" id="h1" th:field="*{h1}"  required />
                </td>
            </tr>
            <tr>
                <td>
                    <input type="text" name="homeDescription" id="homeDescription" th:field="*{homeDescription}"
                        required />
            </tr>
            <tr>
                <td>
                    <p id="previewImage">
                        <img th:src="@{'data:image/*;base64,'+${indexcontent1.generateBase64Image()}}"
                            style="max-width: 240px; max-height: 160px;" />
                    </p>
                    <input type="file" accept="image/*" name="imagefile" id="imagefile"
                        onchange="document.getElementById('previewImage').remove();" />
                </td>
            </tr>
            <tr>
                <td>
                    <input type="text" name="h2" id="h2" th:field="*{h2}" required />
                </td>
            </tr>
            <tr>
                <td>
                    <input type="text" name="h2Description" id="h2Description" th:field="*{h2Description}" required />
            </tr>

            <tr>
                <td>
                    <textarea name="text" id="text" rows="4" cols="100" th:field="*{text}" wrap="hard"
                        required></textarea>
                </td>
            </tr>
            <tr>
                <td colspan=2 style="text-align:right">
                    <button onclick="window.location.href='/indexContent'; return false;" class="btn btn-dark">
                        Annuler
                    </button>
                    <button type="submit" class="btn btn-primary">Enregestrer</button>
                </td>
            </tr>

        </table>

    </form>
</body>

</html>
