<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About content</title>
    <!-- Font Awesome Library -->
    <link rel="stylesheet" href="../css/all.min.css" />
    <!-- Main Template CSS File -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Render All Elements Normally -->
    <link rel="stylesheet" href="../css/normalize.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="index-content-body">

    <div class="admin-links">
        <div class="message-icon">
            <a th:href="@{/messages}" class="messages-link">
                <i class="fa-regular fa-message"></i>
                <div class="unread-message-count">
                    <span th:text="${unreadmessages}" th:if="${unreadmessages > 0}"></span>
                </div>            
            </a>
        </div>
        <a th:href="@{/indexContent}"><i class="fa-solid fa-house"> </i></a>
        <a th:href="@{/servicesContent}"><i class="fa-solid fa-gear"></i></a>
        <a th:href="@{/aboutcontent}" class="active"><i class="fa-regular fa-address-card"></i></a>
    </div>
    <h1>Notre Entreprise</h1>
    <table class="table table-bordered">
        <tbody>
            <tr>
                <td th:text="${aboutcontent.header2}"></td>
                <td style="text-align: center;">
                    <img th:src="@{'data:image/*;base64,'+${aboutcontent.generateBase64Image()}}"
                        style="max-width: 240px; max-height: 160px;" />
                </td>
                <td th:text="${aboutcontent.aboutText}"></td>
                <td class="modifier-index-btn">
                    <a th:href="@{/aboutcontent/viewabout}" class="btn btn-primary">modifier</a>
                </td>

            </tr>
        </tbody>
    </table>
</body>

</html>
