<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>messages</title>
    <!-- Font Awesome Library -->
    <link rel="stylesheet" href="../css/all.min.css" />
    <!-- Main Template CSS File -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Render All Elements Normally -->
    <link rel="stylesheet" href="../css/normalize.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="message-page-body">


    <div class="admin-links">
        <div class="message-icon">
            <a th:href="@{/messages}" class="messages-link-active ">
                <i class="fa-regular fa-message"></i>
                <div class="unread-message-count">
                    <span th:text="${unreadmessages}" th:if="${unreadmessages > 0}"></span>
                </div>
            </a>
        </div>
        <a th:href="@{/indexContent}"><i class="fa-solid fa-house"> </i></a>
        <a th:href="@{/servicesContent}"><i class="fa-solid fa-gear"></i></a>
        <a th:href="@{/aboutcontent}"><i class="fa-regular fa-address-card"></i></a>
    </div>

    <h1>Les Messages</h1>
    <div class="message-number-div">
        <p>le nombre des messages est: <strong th:text="${messagescount}"></strong></p>
    </div>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th scope="col" class="id-container">#</th>
                <th scope="col">nom et prenom</th>
                <th scope="col">gmail</th>
                <th scope="col">message</th>
                <th scope="col">la date</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usermessage : ${usermessages}" th:if="${usermessage.isStared}" class="stared-message">
                <td th:text="${usermessage.id}" class="id-container"></td>
                <td th:text="${usermessage.name}"></td>
                <td th:text="${usermessage.mail}"></td>
                <td th:text="${usermessage.message}"></td>
                <!-- Adjust date formatting as needed -->
                <td th:text="${#dates.format(usermessage.messageDate, 'yyyy-MM-dd HH:mm:ss')}" class="date-data"></td>
                <!-- Adjust date formatting as needed -->
                <td class="buttons-data">
                    <a class="delete-btn" th:href="@{/messages/delete(id=${usermessage.id})}"
                        onclick="return confirm('Etes-vous sur de vouloir supprimer ce message?')"><i class="fa-solid fa-trash"></i></a>
                    <a class="star-btn" th:href="@{/messages/star(id=${usermessage.id})}"><i
                            class="fa-solid fa-star"></i></a>
                    <a class="read-btn" th:href="@{/messages/read(id=${usermessage.id})}">
                        <div class="message-cheked">
                            <i class="fa-solid fa-check" th:if="${usermessage.isRead}"></i>
                        </div>
                        <div class="uncheked-message" th:if="${!usermessage.isRead}">
                            <span>1</span>
                        </div>
                    </a>
                </td>
            </tr>
            <tr th:each="usermessage : ${usermessages}" th:if="${!usermessage.isStared}" class="unstared-message">
                <td th:text="${usermessage.id}" class="id-container"></td>
                <td th:text="${usermessage.name}"></td>
                <td th:text="${usermessage.mail}"></td>
                <td th:text="${usermessage.message}"></td>
                <!-- Adjust date formatting as needed -->
                <td th:text="${#dates.format(usermessage.messageDate, 'yyyy-MM-dd HH:mm:ss')}" class="date-data"></td>
                <!-- Adjust date formatting as needed -->
                <td class="buttons-data">
                    <a class="delete-btn" th:href="@{/messages/delete(id=${usermessage.id})}"
                        onclick="return confirm('Etes-vous sur de vouloir supprimer ce message?')"><i class="fa-solid fa-trash"></i></a>
                    <a class="unstar-btn" th:href="@{/messages/star(id=${usermessage.id})}">
                        <i class="fa-regular fa-star"></i>
                    </a>
                    <a class="read-btn" th:href="@{/messages/read(id=${usermessage.id})}">
                        <div class="message-cheked">
                            <i class="fa-solid fa-check" th:if="${usermessage.isRead}"></i>
                        </div>
                        <div class="uncheked-message" th:if="${!usermessage.isRead}">
                            <span>1</span>
                        </div>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
