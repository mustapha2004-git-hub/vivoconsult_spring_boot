<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>ajouter service</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="services-content-add-body">
    <h1>Ajouter un Service</h1>
    <form th:action="@{/servicesContent/create}" method="post" enctype="multipart/form-data">


        <table  class="table table-bordered">
            <tr>
                <td><label for="h3Service">Service:</label></td>
                <td><input type="text" name="h3Service" id="h3Service" required /></td>
            </tr>
            <tr>
                <td><label for="cardImg">Image:</label></td>
                <td>
                    <input type="file" accept="image/*" name="imagefile" id="imagefile" required />
                </td>
            </tr>
            <tr>
                <td><label for="Service">Service text:</label></td>
                <td>
                    <textarea name="Service" id="Service" rows="4" cols="100" wrap="hard" required></textarea>
                </td>
            </tr>
            <tr>
                <td colspan=2 style="text-align:right">
                    <button onclick="window.location.href='/servicesContent'; return false;" class="btn btn-dark">
                        Annuler
                    </button>
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                </td>
            </tr>

        </table>

    </form>



</body>

</html>
